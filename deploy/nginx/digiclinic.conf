# /etc/nginx/sites-available/digiclinic.conf — a NEW file; no other site's config is edited.
# Replace clinic.example.com and 8110 (WEB_PORT) before enabling. Steps in deploy/README.md §4.

# Step 1 (before the certificate exists): only this server block is enabled, for the ACME challenge.
server {
    listen 80;
    listen [::]:80;
    server_name clinic.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

