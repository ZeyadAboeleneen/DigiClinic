# DigiClinic on a VPS (07 §7.6): web (gunicorn) · scheduler · whatsapp gateway · db.
# Only `web` is published, and only on 127.0.0.1 — the host's existing Nginx proxies the subdomain to it.
# Nothing here touches ports 80/443 or other projects.
#
#   cd /opt/digiclinic && docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
name: digiclinic

x-app: &app
  image: digiclinic:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://digiclinic:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/digiclinic
    WA_GATEWAY_URL: http://whatsapp:3320
    MEDIA_ROOT: /data/media
    BACKUP_DIR: /data/backups
  volumes:
    - appdata:/data
  depends_on:
    db:
      condition: service_healthy
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: digiclinic
      POSTGRES_USER: digiclinic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digiclinic -d digiclinic"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    <<: *app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8110}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    <<: *app
    command: ["python", "manage.py", "run_scheduler"]
    stop_grace_period: 30s

  whatsapp:
    build:
      context: ..
      dockerfile: deploy/whatsapp.Dockerfile
    image: digiclinic-whatsapp:latest
    restart: unless-stopped
    environment:
      WA_GATEWAY_KEY: ${WA_GATEWAY_KEY:?set WA_GATEWAY_KEY in deploy/.env}
      WA_WEBHOOK_SECRET: ${WA_WEBHOOK_SECRET:-}
      WA_WEBHOOK_URL: http://web:8000/integrations/whatsapp/webhook/
    volumes:
      - whatsapp:/data/whatsapp
    shm_size: 1gb  # Chromium needs more than Docker's 64 MB default
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  appdata:
  whatsapp:
