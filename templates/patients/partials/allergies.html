{% load i18n %}
<div class="space-y-2">
  <ul class="divide-y divide-stone-100 text-sm">
    {% for a in allergies %}
    <li class="flex items-center gap-2 py-1">
      <span class="flex-1">{{ a.name }}</span>
      <span class="badge bg-red-50 text-red-700">{{ a.get_severity_display }}</span>
      {% if can.patient_edit_basic %}
      <button type="button" class="text-xs text-red-600"
              hx-post="{% url 'patients:allergy_delete' patient.pk a.pk %}" hx-target="#allergies" hx-swap="innerHTML"
              hx-confirm="{% translate 'تمسح الحساسية دي؟' %}">{% translate "مسح" %}</button>
      {% endif %}
    </li>
    {% empty %}
    <li class="py-2 text-stone-400">{% translate "مفيش حساسيات مسجلة" %}</li>
    {% endfor %}
  </ul>
  {% if can.patient_edit_basic %}
  <form class="flex flex-wrap items-end gap-2 border-t border-stone-100 pt-2"
        hx-post="{% url 'patients:allergy_add' patient.pk %}" hx-target="#allergies" hx-swap="innerHTML">
    {% csrf_token %}
    <input type="text" name="name" placeholder="{% translate 'اسم الحساسية' %}" required class="flex-1 rounded-lg border border-stone-300 px-2 py-1 text-sm">
    <select name="severity" class="rounded-lg border border-stone-300 px-2 py-1 text-sm">
      <option value="mild">{% translate "خفيفة" %}</option>
      <option value="moderate" selected>{% translate "متوسطة" %}</option>
      <option value="severe">{% translate "شديدة" %}</option>
    </select>
    <button type="submit" class="btn-secondary text-xs">{% translate "إضافة" %}</button>
  </form>
  {% endif %}
</div>
