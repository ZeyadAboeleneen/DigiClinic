{% load i18n %}
<div class="space-y-2">
  <ul class="divide-y divide-stone-100 text-sm">
    {% for c in chronic_conditions %}
    <li class="flex items-center gap-2 py-1">
      <span class="flex-1">{{ c.name }}</span>
      {% if can.patient_edit_medical %}
      <button type="button" class="text-xs text-red-600"
              hx-post="{% url 'patients:condition_delete' patient.pk c.pk %}" hx-target="#conditions" hx-swap="innerHTML"
              hx-confirm="{% translate 'تمسح المرض ده؟' %}">{% translate "مسح" %}</button>
      {% endif %}
    </li>
    {% empty %}
    <li class="py-2 text-stone-400">{% translate "مفيش أمراض مزمنة مسجلة" %}</li>
    {% endfor %}
  </ul>
  {% if can.patient_edit_medical %}
  <form class="flex flex-wrap items-end gap-2 border-t border-stone-100 pt-2"
        hx-post="{% url 'patients:condition_add' patient.pk %}" hx-target="#conditions" hx-swap="innerHTML">
    {% csrf_token %}
    <input type="text" name="name" placeholder="{% translate 'اسم المرض' %}" required class="flex-1 rounded-lg border border-stone-300 px-2 py-1 text-sm">
    <button type="submit" class="btn-secondary text-xs">{% translate "إضافة" %}</button>
  </form>
  {% endif %}
</div>
