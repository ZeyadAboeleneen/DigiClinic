{% extends "base_page.html" %}
{% load static i18n %}
{% block body %}
<div class="flex min-h-screen items-center justify-center px-4 py-10">
  <div class="w-full max-w-sm">
    <div class="mb-6 text-center">
      <img src="{% static 'img/logo.png' %}" alt="{% translate 'البرق للتجارة والتوريدات' %}" class="mx-auto h-24 w-24 object-contain">
      <h1 class="mt-3 text-xl font-bold">{% translate "مرسول البرق" %}</h1>
      <p class="text-sm text-stone-500">{% translate "نظام عروض الأسعار" %}</p>
    </div>
    <div class="card p-6">
      {% block card %}{% endblock %}
    </div>
  </div>
</div>
{% endblock %}
