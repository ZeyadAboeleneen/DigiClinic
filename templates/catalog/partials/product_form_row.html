{% load i18n %}
<form {% if product %}id="product-{{ product.pk }}" data-id="{{ product.pk }}"{% endif %}
      class="grid gap-2 bg-sand/60 px-4 py-3 text-sm sm:grid-cols-12 sm:items-start"
      hx-post="{% if product %}{% url 'catalog:product_edit' product.pk %}{% else %}{% url 'catalog:product_create' category.pk %}{% endif %}"
      hx-target="this" hx-swap="outerHTML" novalidate>
  {% csrf_token %}
  <div class="form-field sm:col-span-5">{{ form.name }}{{ form.name.errors }}</div>
  <div class="form-field sm:col-span-2"><input type="text" name="unit_name" value="{{ form.unit_name.value|default:'' }}" list="unit-options" placeholder="{% translate 'الوحدة' %}" required>{{ form.unit_name.errors }}</div>
  <div class="form-field sm:col-span-3">{{ form.category }}{{ form.category.errors }}</div>
  <div class="flex gap-1 sm:col-span-2">
    <button type="submit" class="btn-primary px-3 py-1.5">{% translate "حفظ" %}</button>
    {% if product %}
      <button type="button" class="btn-ghost px-3 py-1.5" hx-get="{% url 'catalog:product_row' product.pk %}" hx-target="closest form" hx-swap="outerHTML">{% translate "إلغاء" %}</button>
    {% else %}
      <button type="button" class="btn-ghost px-3 py-1.5" onclick="this.closest('form').remove()">{% translate "إلغاء" %}</button>
    {% endif %}
  </div>
</form>
