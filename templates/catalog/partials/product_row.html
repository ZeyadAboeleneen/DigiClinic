{% load i18n %}
<div id="product-{{ p.pk }}" data-id="{{ p.pk }}" class="flex items-center gap-3 bg-white px-4 py-2 text-sm {% if not p.is_active %}opacity-50{% endif %}">
  {% if can_edit %}<span class="drag cursor-grab select-none text-stone-300 hover:text-stone-500" title="{% translate 'اسحب للترتيب' %}">⠿</span>{% endif %}
  <span class="min-w-0 flex-1 truncate">{{ p.name }}
    {% if not p.is_active %}<span class="badge bg-stone-100 text-stone-500">{% translate "متوقف" %}</span>{% endif %}</span>
  <span class="w-20 shrink-0 text-center text-stone-500">{{ p.unit.name }}</span>
  {% if can_edit %}
  <span class="flex shrink-0 gap-1">
    <button type="button" class="btn-ghost px-2 py-0.5 text-xs" hx-get="{% url 'catalog:product_edit' p.pk %}" hx-target="#product-{{ p.pk }}" hx-swap="outerHTML">{% translate "تعديل" %}</button>
    <button type="button" class="btn-ghost px-2 py-0.5 text-xs" hx-post="{% url 'catalog:product_toggle' p.pk %}" hx-target="#product-{{ p.pk }}" hx-swap="outerHTML"
            {% if p.is_active %}hx-confirm="{% translate 'إيقاف الصنف ده؟ مش هيظهر في العروض الجديدة.' %}"{% endif %}>
      {% if p.is_active %}{% translate "إيقاف" %}{% else %}{% translate "تفعيل" %}{% endif %}
    </button>
    <button type="button" class="btn-ghost px-2 py-0.5 text-xs text-red-700" hx-post="{% url 'catalog:product_delete' p.pk %}"
            hx-target="#product-{{ p.pk }}" hx-swap="outerHTML" hx-confirm="{% translate 'مسح الصنف ده نهائيًا؟ العروض القديمة مش هتتأثر.' %}">{% translate "مسح" %}</button>
  </span>
  {% endif %}
</div>
