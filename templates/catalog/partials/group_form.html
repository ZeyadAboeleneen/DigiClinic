{% load i18n %}
<form class="card mb-4 space-y-2 border-brand/30 bg-sand/60 p-4 text-sm"
      hx-post="{% if instance %}{% url 'catalog:group_edit' instance.pk %}{% else %}{% url 'catalog:group_create' %}{% endif %}"
      hx-target="this" hx-swap="outerHTML" novalidate>
  {% csrf_token %}
  <div class="font-bold">{% if instance %}{% translate "تعديل المجموعة" %}{% else %}{% translate "مجموعة جديدة" %}{% endif %}</div>
  {% include "partials/field.html" with field=form.name %}
  {% include "partials/field.html" with field=form.description %}
  <div class="flex gap-2">
    <button type="submit" class="btn-primary px-3 py-2">{% translate "حفظ" %}</button>
    <button type="button" class="btn-ghost px-3 py-2" onclick="this.closest('form').remove()">{% translate "إلغاء" %}</button>
  </div>
</form>
