{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "العروض" %}{% endblock %}
{% block content %}
<div class="mb-6 flex flex-wrap items-center justify-between gap-3">
  <h1 class="text-2xl font-bold">{% translate "عروض الأسعار" %}</h1>
  {% if can.quotation_create %}
  <form method="post" action="{% url 'quotations:new' %}">{% csrf_token %}
    <button class="btn-primary">{% translate "+ عرض سعر جديد" %}</button>
  </form>
  {% endif %}
</div>

<form class="card mb-4 grid gap-2 p-3 sm:grid-cols-6"
      hx-get="{% url 'quotations:list' %}" hx-target="#quote-rows" hx-swap="outerHTML" hx-push-url="true"
      hx-trigger="input changed delay:250ms from:#fq, change">
  <input id="fq" type="search" name="q" value="{{ f.q }}" placeholder="{% translate 'رقم العرض أو اسم العميل' %}"
         class="rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm sm:col-span-2">
  <select name="status" class="rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm">
    <option value="">{% translate "كل الحالات" %}</option>
    {% for v, l in statuses %}<option value="{{ v }}" {% if v == f.status %}selected{% endif %}>{{ l }}</option>{% endfor %}
    <option value="all" {% if f.status == 'all' %}selected{% endif %}>{% translate "الكل + القديم" %}</option>
  </select>
  <select name="customer" class="rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm">
    <option value="">{% translate "كل العملاء" %}</option>
    {% for c in customers %}<option value="{{ c.pk }}" {% if c.pk|stringformat:'s' == f.customer %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
  </select>
  <select name="user" class="rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm">
    <option value="">{% translate "كل المستخدمين" %}</option>
    {% for u in users %}<option value="{{ u.pk }}" {% if u.pk|stringformat:'s' == f.user %}selected{% endif %}>{{ u.full_name }}</option>{% endfor %}
  </select>
  <div class="flex gap-1">
    <input type="date" name="from" value="{{ f.from }}" class="min-w-0 flex-1 rounded-lg border border-stone-300 bg-white px-2 py-2 text-xs" aria-label="{% translate 'من' %}">
    <input type="date" name="to" value="{{ f.to }}" class="min-w-0 flex-1 rounded-lg border border-stone-300 bg-white px-2 py-2 text-xs" aria-label="{% translate 'إلى' %}">
  </div>
</form>

{% include "quotations/partials/list_rows.html" %}
{% endblock %}
