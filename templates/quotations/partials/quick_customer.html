{% load i18n %}
<form class="flex flex-wrap items-start gap-2 rounded-lg bg-sand/60 p-3" hx-post="{% url 'quotations:quick_customer' q.pk %}" hx-target="this" hx-swap="outerHTML" novalidate>
  {% csrf_token %}
  <div class="form-field min-w-48 flex-1">
    <input type="text" name="name" placeholder="{% translate 'اسم الفندق / الشركة' %}" required>
    {% if error %}<ul class="errorlist"><li>{{ error }}</li></ul>{% endif %}
  </div>
  <div class="form-field w-40">
    <select name="kind">{% for v, l in kinds %}<option value="{{ v }}" {% if v == "hotel" %}selected{% endif %}>{{ l }}</option>{% endfor %}</select>
  </div>
  <button class="btn-primary px-3 py-2">{% translate "إضافة" %}</button>
  <button type="button" class="btn-ghost px-3 py-2" onclick="this.closest('form').remove()">{% translate "إلغاء" %}</button>
</form>
