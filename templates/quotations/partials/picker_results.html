{% load i18n %}
{% for c, products in tree %}
<div class="border-b border-stone-100">
  <div class="sticky top-0 z-10 flex items-center gap-2 bg-brand-soft px-3 py-1.5">
    <span class="flex-1 truncate text-xs font-bold text-brand">{{ c.name }}</span>
    <button type="button" class="rounded bg-white/70 px-2 py-0.5 text-xs font-semibold text-brand hover:bg-white"
            hx-post="{% url 'quotations:add_category' q.pk %}" hx-vals='{"category": "{{ c.pk }}"}'>{% translate "+ القسم كله" %}</button>
  </div>
  {% for p in products %}
    {% if p.pk in added %}
    <button type="button" class="pick-add flex w-full items-center gap-2 px-3 py-1.5 text-start text-sm text-stone-400" disabled>
      <span class="text-green-600">✓</span><span class="flex-1 truncate">{{ p.name }}</span><span class="text-xs">{{ p.unit.name }}</span>
    </button>
    {% else %}
    <button type="button" class="pick-add flex w-full items-center gap-2 px-3 py-1.5 text-start text-sm hover:bg-sand"
            hx-post="{% url 'quotations:add_item' q.pk %}" hx-vals='{"product": "{{ p.pk }}"}'>
      <span class="text-brand">+</span><span class="flex-1 truncate">{{ p.name }}</span><span class="text-xs text-stone-400">{{ p.unit.name }}</span>
    </button>
    {% endif %}
  {% endfor %}
</div>
{% empty %}
<p class="px-3 py-6 text-center text-sm text-stone-500">{% translate "مفيش أصناف بالاسم ده. تقدر تضيفه كصنف خاص." %}</p>
{% endfor %}
