<script>
  // 05 §5.4: print the PDF through a hidden iframe → Chrome opens its print dialog directly.
  window.printRx = (url) => {
    let frame = document.getElementById("rx-print-frame");
    if (frame) frame.remove();
    frame = document.createElement("iframe");
    frame.id = "rx-print-frame";
    frame.style.cssText = "position:fixed;width:0;height:0;border:0;right:0;bottom:0";
    frame.onload = () => { try { frame.contentWindow.focus(); frame.contentWindow.print(); } catch (e) { window.open(url, "_blank"); } };
    frame.src = url;
    document.body.appendChild(frame);
  };
  // Dose phrases: insert into the last focused instructions/duration cell of the prescription builder.
  (() => {
    let lastCell = null;
    document.addEventListener("focusin", (e) => { if (e.target.matches?.(".rx-instr, .rx-duration")) lastCell = e.target; });
    document.addEventListener("click", (e) => {
      const btn = e.target.closest?.("#rx-phrases button[data-text]");
      if (!btn) return;
      let cell = lastCell && document.contains(lastCell) ? lastCell : document.querySelector(".rx-instr:last-of-type");
      if (!cell) return;
      if (btn.dataset.kind === "duration") cell = cell.parentElement.querySelector(".rx-duration") || cell;
      else if (cell.classList.contains("rx-duration")) cell = cell.parentElement.querySelector(".rx-instr") || cell;
      const text = btn.dataset.text;
      cell.value = btn.dataset.kind === "duration" || !cell.value.trim() ? text : `${cell.value.trim()} ${text}`;
      cell.dispatchEvent(new Event("input", { bubbles: true }));
      cell.focus();
    });
  })();
  // Drug-category buttons in the prescription builder: one tap filters the search; the choice sticks (per doctor)
  // for the next drug, across re-renders, until another category or "الكل" is tapped.
  (() => {
    const key = (box) => `rx-cat:${box.dataset.doctor}`;
    const mark = (box, id) => box.querySelectorAll(".rx-cat").forEach((b) => {
      const on = b.dataset.cat === id;
      b.classList.toggle("bg-brand", on);
      b.classList.toggle("text-white", on);
      b.classList.toggle("border-brand", on);
    });
    const restore = () => {
      const box = document.getElementById("rx-cats");
      const input = document.getElementById("rx-category");
      if (!box || !input) return;
      let saved = "";
      try { saved = localStorage.getItem(key(box)) || ""; } catch (e) { /* private mode */ }
      if (saved && !box.querySelector(`.rx-cat[data-cat="${saved}"]`)) saved = "";  // category was removed
      input.value = saved;
      mark(box, saved);
    };
    document.addEventListener("click", (e) => {
      const chip = e.target.closest?.("#rx-cats .rx-cat");
      if (!chip) return;
      const box = document.getElementById("rx-cats");
      const id = chip.dataset.cat;
      try { localStorage.setItem(key(box), id); } catch (err) { /* ignore */ }
      document.getElementById("rx-category").value = id;
      mark(box, id);
      const search = document.getElementById("rx-search");
      if (id || search.value.trim()) {
        htmx.ajax("GET", box.dataset.searchUrl, { target: "#drug-results", swap: "innerHTML", values: { drug_name: search.value, category: id } });
      } else {
        document.getElementById("drug-results").innerHTML = "";
      }
      search.focus();
    });
    document.addEventListener("htmx:afterSettle", restore);
    document.addEventListener("DOMContentLoaded", restore);
  })();
  // Voice results box: a row added or dismissed disappears; the box closes with its last row.
  window.rxDictationDone = (el) => {
    const box = document.getElementById("dictation-box");
    el.closest("[data-dictated-line]")?.remove();
    if (box && !box.querySelector("[data-dictated-line]")) document.getElementById("rx-dictation").innerHTML = "";
  };
  // "أضف الكل": each row's best match, one after the other (each add re-renders the prescription).
  window.rxAddAll = async (btn) => {
    btn.disabled = true;
    for (const row of [...document.querySelectorAll("#dictation-box [data-dictated-line]")]) {
      const add = row.querySelector("[data-primary]");
      if (!add) continue;
      await htmx.ajax("POST", add.getAttribute("hx-post"), {
        target: "#rx-builder", swap: "outerHTML", values: JSON.parse(add.getAttribute("hx-vals")),
      });
      row.remove();
    }
    const box = document.getElementById("rx-dictation");
    if (box && !box.querySelector("[data-dictated-line]")) box.innerHTML = "";
  };
</script>
