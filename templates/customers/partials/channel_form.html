{% load i18n %}
<form class="mt-2 flex flex-wrap items-start gap-2 rounded-lg bg-sand/60 p-2"
      hx-post="{% url 'customers:channel_add' contact.pk %}" hx-target="this" hx-swap="outerHTML" novalidate>
  {% csrf_token %}
  <div class="form-field w-28">{{ form.type }}</div>
  <div class="form-field min-w-40 flex-1">{{ form.value }}{{ form.value.errors }}</div>
  <div class="form-field w-32">{{ form.label }}</div>
  <button type="submit" class="btn-primary px-3 py-2">{% translate "إضافة" %}</button>
  <button type="button" class="btn-ghost px-3 py-2" onclick="this.closest('form').remove()">{% translate "إلغاء" %}</button>
</form>
