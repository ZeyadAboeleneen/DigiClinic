{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "العملاء" %}{% endblock %}
{% block content %}
<div class="mb-6 flex flex-wrap items-center justify-between gap-3">
  <h1 class="text-2xl font-bold">{% translate "العملاء" %}</h1>
  {% if can.customer_edit %}
    <a href="{% url 'customers:create' %}" class="btn-primary">
      <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
      {% translate "عميل جديد" %}
    </a>
  {% endif %}
</div>

<form class="card mb-4 flex flex-col gap-3 p-3 sm:flex-row sm:items-center"
      hx-get="{% url 'customers:list' %}" hx-target="#customer-rows" hx-swap="outerHTML"
      hx-trigger="input changed delay:250ms from:#q, change" hx-push-url="true">
  <div class="relative flex-1">
    <svg class="pointer-events-none absolute inset-y-0 start-3 my-auto size-5 text-stone-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" d="m21 21-4.3-4.3M17 10.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0z"/></svg>
    <input id="q" type="search" name="q" value="{{ q }}" autofocus autocomplete="off"
           placeholder="{% translate 'ابحث بالاسم أو اسم المسؤول أو الرقم...' %}"
           class="w-full rounded-lg border border-stone-300 bg-white py-2 ps-10 pe-3 text-sm focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20">
  </div>
  <select name="kind" class="rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm" aria-label="{% translate 'النوع' %}">
    <option value="">{% translate "كل الأنواع" %}</option>
    {% for value, label in kinds %}<option value="{{ value }}" {% if value == kind %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select>
  <select name="show" class="rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm" aria-label="{% translate 'الحالة' %}">
    <option value="active" {% if show != 'all' %}selected{% endif %}>{% translate "النشطين" %}</option>
    <option value="all" {% if show == 'all' %}selected{% endif %}>{% translate "الكل" %}</option>
  </select>
</form>

{% include "customers/partials/rows.html" %}
{% endblock %}
