{% load i18n %}
<div class="form-field">
  {% if label %}<label for="f-{{ name }}">{{ label }}</label>{% endif %}
  {% if list %}
  <div class="dictate-inline"><input id="f-{{ name }}" name="value" data-field="{{ name }}" class="autosave" dir="auto" {% if editable %}data-dictate{% endif %} list="{{ list }}" autocomplete="off"
         value="{{ value }}" {% if not editable %}disabled{% endif %}></div>
  {% else %}
  <div class="dictate-corner"><textarea id="f-{{ name }}" name="value" data-field="{{ name }}" class="autosave" dir="auto" {% if editable %}data-dictate{% endif %} rows="{{ rows }}"
            {% if not editable %}disabled{% endif %}>{{ value }}</textarea></div>
  {% endif %}
  {% if chips and editable %}
  <div class="mt-1.5 flex flex-wrap gap-1">
    {% for c in chips %}<button type="button" class="chip-soft" data-insert="{{ name }}" data-text="{{ c }}"><bdi dir="auto">{{ c }}</bdi></button>{% endfor %}
  </div>
  {% endif %}
</div>
