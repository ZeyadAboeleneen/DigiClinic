<div class="card p-3">
  <div class="mb-1 flex items-baseline justify-between text-xs text-stone-500">
    <span>{{ title }}</span>
    <span dir="ltr">{{ c.min }}–{{ c.max }} {{ unit }} · <b class="text-ink">{{ c.last }}</b></span>
  </div>
  <svg viewBox="0 0 {{ c.width }} {{ c.height }}" class="h-16 w-full" preserveAspectRatio="none" style="transform:scaleX(-1)" aria-hidden="true">
    <polyline points="{{ c.points }}" fill="none" stroke="currentColor" stroke-width="2" class="text-brand" vector-effect="non-scaling-stroke"/>
  </svg>
</div>
